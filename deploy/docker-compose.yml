name: relay
services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - relay-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      PORT: 8787
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      KEY_PEPPER: ${KEY_PEPPER:?Set KEY_PEPPER in your local .env}
      DEVICE_TOKEN_PEPPER: ${DEVICE_TOKEN_PEPPER:?Set DEVICE_TOKEN_PEPPER in your local .env}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?Set WEBHOOK_SIGNING_SECRET in your local .env}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      RELAY_BOOTSTRAP_API_KEY: ${RELAY_BOOTSTRAP_API_KEY:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  relay-postgres:
