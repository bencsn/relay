version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime-dependencies:
        dependency-type: production
    ignore:
      # Compiler majors can require source migrations; review them as planned work.
      # Dependabot security updates remain enabled independently of version updates.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
